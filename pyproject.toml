[project]
name = "yunohost-nostr-auth"
version = "0.1.0"
description = "Nostr (NIP-07/NIP-46) authentication add-on service for existing YunoHost accounts"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "bech32>=1.2.0",
    "coincurve>=21.0.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.4",
    "starlette>=0.47.0",
]

[project.scripts]
yunohost-nostr-auth = "yunohost_nostr_auth.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yunohost_nostr_auth"]
