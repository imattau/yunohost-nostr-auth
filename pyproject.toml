[project]
name = "yunohost-nostr-auth"
version = "0.1.0"
description = "Nostr (NIP-07/NIP-46) authentication add-on service for existing YunoHost accounts"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "nostr-sdk>=0.45.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.4",
    "starlette>=0.47.0",
    "pyjwt>=2.13.0",
    "cryptography>=50.0.1",
]

[project.scripts]
yunohost-nostr-auth = "yunohost_nostr_auth.server:main"
yunohost-nostr-auth-mint-session-server = "yunohost_nostr_auth.ynh.mint_session_server:main"
yunohost-nostr-auth-identity-lookup-server = "yunohost_nostr_auth.ynh.identity_lookup_server:main"
yunohost-nostr-auth-admin = "yunohost_nostr_auth.admin_cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yunohost_nostr_auth"]
